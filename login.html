<!-- login.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- link -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="#" />
    <!-- script -->
    <script type="module" src="js/login.js"></script>
    <title>Login</title>
  </head>
  <body>
    <div class="page-wrapper">
      <header>
        <a class="logo-home-link" href="index.html">DVP</a>
      </header>

      <main>
        <h1>Login</h1>

        <div class="form-div">
          <form class="login-form">
            <fieldset>
              <div>
                <div id="js-message-container"></div>

                <!-- email -->
                <div>
                  <div>
                    <label for="email">Email</label>
                  </div>
                  <input
                    class="login-input"
                    id="email"
                    name="email"
                    type="email"
                    placeholder="email address"
                    autocomplete="email"
                    required
                  />
                </div>

                <!-- password -->
                <div>
                  <div>
                    <label for="password">Password</label>
                  </div>
                  <input
                    class="login-input"
                    id="password"
                    name="password"
                    type="password"
                    placeholder="password"
                    autocomplete="current-password"
                    required
                    minlength="6"
                  />
                </div>
              </div>

              <button class="login-btn" type="submit">Login</button>
            </fieldset>
          </form>
        </div>
      </main>

      <footer>
        <p>&copy; 2026 DVP</p>
      </footer>
    </div>
  </body>
</html>
