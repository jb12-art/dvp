<!-- index.html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- link -->
    <link rel="icon" href="#" />
    <link rel="stylesheet" href="css/styles.css" />
    <!-- script -->
    <script type="module" src="js/posts.js"></script>
    <title>Home</title>
  </head>
  <body>
    <div class="page-wrapper">
      <header>
        <a class="logo-home-link" href="index.html">DVP</a>
      </header>

      <main>
        <!-- logout button -->
        <div class="logout-btn-div">
          <button id="js-logout-btn" class="logout-btn">Logout</button>
        </div>

        <!--  -->
        <h1>Home | Posts</h1>

        <!-- register link -->
        <a class="register-link" href="register.html">Register</a>

        <!-- login link -->
        <a class="login-link" href="login.html">Login</a>

        <!-- post form -->
        <form class="create-post-form">
          <h2 class="create-post-title">Create a new post</h2>
          <div id="js-message-container"></div>

          <!-- title -->
          <label for="title">Title</label>
          <input
            class="input-title"
            id="title"
            name="title"
            type="text"
            placeholder="Enter post title (*required)"
            required
          />

          <!-- content -->
          <label for="content">Content</label>
          <textarea
            id="content"
            name="content"
            rows="5"
            placeholder="Enter post content (*required)"
            required
          ></textarea>

          <!-- category -->
          <label for="category">category</label>
          <input
            class="input-category"
            id="category"
            name="category"
            type="text"
            placeholder="Enter post category"
          />

          <!-- button -->
          <button class="create-post-btn" type="submit">Create post</button>

          <!-- container to display posts -->
          <div>
            <h2>Browse Posts</h2>
            <div id="posts-list"></div>
          </div>
        </form>
      </main>

      <footer>
        <p>&copy; 2026 DVP</p>
      </footer>
    </div>
  </body>
</html>
